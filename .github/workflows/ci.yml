name: Verify RepoPilot
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/ci.db
      DATA_DIR: ./data/ci-repositories
      JOB_BACKEND: local
      LLM_PROVIDER: extractive
      EMBEDDING_PROVIDER: local
      SANDBOX_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c backend/requirements.lock.txt -e './backend[test]'
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/e2e.db
      DATA_DIR: ./data/e2e-repositories
      JOB_BACKEND: local
      LLM_PROVIDER: extractive
      EMBEDDING_PROVIDER: local
      SANDBOX_ENABLED: "false"
      SERVER_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: python -m pip install -c backend/requirements.lock.txt -e './backend[test]'
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/repopilot-api.log 2>&1 &
        working-directory: backend
      - run: pnpm start > /tmp/repopilot-frontend.log 2>&1 &
        working-directory: frontend
      - run: curl --retry 30 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:3000/api/health
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
