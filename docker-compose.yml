services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repopilot-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-repopilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-repopilot}:${POSTGRES_PASSWORD:-repopilot-local-password}@postgres:5432/${POSTGRES_DB:-repopilot}
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: rq
      DATA_DIR: /data
      SANDBOX_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - repository-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-environment
    command: ["python", "-m", "app.worker"]
    volumes:
      - repository-data:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from datetime import datetime, timezone; import socket; from redis import Redis; from rq import Worker; from app.config import settings; workers=Worker.all(connection=Redis.from_url(settings.redis_url)); healthy=any(w.hostname==socket.gethostname() and w.last_heartbeat and (datetime.now(timezone.utc)-w.last_heartbeat).total_seconds()<180 for w in workers); raise SystemExit(0 if healthy else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SERVER_API_URL: http://backend:8000
      SERVER_API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  repository-data:
