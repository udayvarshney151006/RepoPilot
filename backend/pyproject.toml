[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-backend"
version = "0.1.0"
description = "Repository-grounded code intelligence and controlled debugging"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
 "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
 "pgvector>=0.3.6,<1", "redis>=5.2,<7", "rq>=2.2,<3", "httpx>=0.28,<1",
 "python-multipart>=0.0.20,<1", "tree-sitter>=0.25,<0.26",
 "tree-sitter-python>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
 "tree-sitter-typescript>=0.23,<0.24"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
